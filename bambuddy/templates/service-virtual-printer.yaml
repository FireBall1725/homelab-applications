{{- if .Values.virtualPrinter.enabled }}
{{- /*
  Virtual printer: emulates a Bambu Lab printer so Bambu Studio / OrcaSlicer can send
  jobs straight to Bambuddy. It binds a fixed set of privileged and high ports plus a
  block of FTP passive-data ports, ten per virtual printer instance.

  Written by hand rather than through the common library because the passive range has
  to be generated by a loop, which values.yaml cannot express.

  MetalLB service-pool is 10.0.1.101-10.0.1.119. Traefik holds 10.0.1.100 (ingress-pool)
  and mosquitto holds 10.0.1.101.

  externalTrafficPolicy Local preserves the client address and, with a single replica,
  makes MetalLB advertise the VIP only from the node running the pod.

  SSDP announcements leave with the pod/node source address rather than the VIP, so
  auto-discovery in the slicer will not find this. Add it manually by IP.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.names.fullname" . }}-vp
  labels:
    {{- include "common.labels" . | nindent 4 }}
    # Distinguishes this Service from the main one. The ServiceMonitor selects on the
    # absence of this key so it never tries to scrape the virtual printer ports.
    app.kubernetes.io/component: virtual-printer
  annotations:
    metallb.universe.tf/loadBalancerIPs: {{ .Values.virtualPrinter.loadBalancerIP | quote }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: vp-bind
      port: 3000
      targetPort: 3000
      protocol: TCP
    - name: vp-detect
      port: 3002
      targetPort: 3002
      protocol: TCP
    - name: vp-ssdp
      port: 2021
      targetPort: 2021
      protocol: UDP
    - name: vp-mqtt
      port: 8883
      targetPort: 8883
      protocol: TCP
    - name: vp-rtsp
      port: 322
      targetPort: 322
      protocol: TCP
    - name: vp-ftps
      port: 990
      targetPort: 990
      protocol: TCP
    - name: vp-tunnel
      port: 6000
      targetPort: 6000
      protocol: TCP
    {{- $start := int .Values.virtualPrinter.passivePortStart }}
    {{- $end := add $start (int .Values.virtualPrinter.passivePortCount) }}
    {{- range $port := untilStep $start (int $end) 1 }}
    - name: pasv-{{ $port }}
      port: {{ $port }}
      targetPort: {{ $port }}
      protocol: TCP
    {{- end }}
  selector:
    {{- include "common.labels.selectorLabels" . | nindent 4 }}
{{- end }}
