# error-pages configuration
# https://github.com/tarampampam/error-pages

image:
  repository: ghcr.io/tarampampam/error-pages
  tag: "3"
  pullPolicy: IfNotPresent

# Theme configuration
# Available themes: app-down, cats, connection, ghost, hacker-terminal,
#                   l7, lost-in-space, noise, orient, shuffle, win98
templateName: "connection"

# Show additional details on error pages (useful for debugging)
showDetails: false

# Service configuration
service:
  port: 8080
  type: ClusterIP

# Resource limits
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Replicas for high availability
replicaCount: 2

# Middleware configuration
middleware:
  # Name of the middleware (will be prefixed with release name)
  name: error-pages
  # HTTP status codes to intercept. Comma-separated; each entry is a single
  # code or a hyphenated range.
  #
  # Deliberately not 400-599. This middleware is attached to both entrypoints
  # globally, so it also sits in front of every JSON API in the cluster, and
  # Traefik's errors middleware replaces the response body outright. An API
  # that answered {"error": "invalid credentials"} had it swapped for this
  # service's {"error": true, "code": 401, ...}, which is how a Librarium
  # login with a wrong password came to render the word "true" to the user
  # (2026-09-17). The codes below are the ones a person reads as a page;
  # 400, 401, 409 and 422 carry meaning for a caller and now pass through.
  #
  # 404 and 5xx are still intercepted, which is a deliberate trade: they are
  # the ones most worth a friendly page, and an API 404 or 500 body is less
  # likely to be shown to a user verbatim. Exempting a route entirely is not
  # possible while the middleware is attached at the entrypoint, because
  # Traefik prepends entrypoint middlewares to every router with no opt-out.
  errorStatusCodes: "403,404,500-504"
