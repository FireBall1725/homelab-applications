# Session, cookie and CSRF secret for Terminus.
#
# Sealed rather than generated. The previous template used `randAlphaNum 64`,
# which minted a new value on every render; ArgoCD caches manifests per
# (revision, path), so it rotated on every commit to this repo while the running
# pods kept whatever value they started with.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: terminus-app
  namespace: app-terminus
spec:
  encryptedData:
    app-secret: 
  template:
    metadata:
      name: terminus-app
      namespace: app-terminus
      labels:
        app.kubernetes.io/name: terminus
        app.kubernetes.io/component: web
    type: Opaque
