{{- /*
  Kept deliberately, even though it now carries nothing but the default label.

  This file was added on 2026-08-01 to give the namespace privileged PSA labels for a
  hostNetwork experiment, which was reverted the same day. Deleting the file would hand
  Argo (prune: true) a Namespace to remove, taking the PVC and the Postgres cluster with
  it. Emptying the labels instead drops the namespace back to the cluster-default baseline
  policy, which is all NET_BIND_SERVICE needs.
*/}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    kubernetes.io/metadata.name: {{ .Release.Namespace }}
