# Bambuddy - homelab values
#
# Self-hosted control plane for Bambu Lab printers. Built on the firelabs-helm-common
# library, matching the firebin-api / librarium-api pattern: pinned image, a
# CloudNativePG-managed Postgres cluster, SealedSecrets for credentials, Traefik
# "internal" ingress.
#
# Networking note: upstream docs push `network_mode: host`, but every functional path to
# the printer is OUTBOUND (MQTT 8883/TLS, FTPS 990, RTSP 322), which routes fine from a
# pod. The virtual printer gets a MetalLB VIP instead, so its address survives the pod
# moving between nodes. hostNetwork was tried on 2026-08-01 and reverted for exactly that
# reason: it makes the printer's address the node's address, which pins the workload.
#
# What the VIP alone does not fix is Bambuddy telling the slicer where it lives. It
# rewrites `net.info[].ip` in its MQTT status push from its own bind address and never
# reads remote_interface_ip, so Bambu Studio was told the printer was at 10.244.12.90 and
# hung on Send. See vpAdvertisePatch below.

global:
  # Keep release names predictable (otherwise common prepends the release name).
  fullnameOverride: bambuddy

image:
  repository: ghcr.io/maziggy/bambuddy
  tag: "1.2.5.1"
  pullPolicy: IfNotPresent

# Single-replica, Recreate strategy - the archive PVC is RWO.
controller:
  replicas: 1
  strategy: Recreate

# The orca-slicer-api sidecar publishes linux/amd64 only, and talos-piwk-01 is arm64.
# No node pin: the VP address is the MetalLB VIP, so the pod is free to move.
nodeSelector:
  kubernetes.io/arch: amd64

# The image starts as root and drops to PUID:PGID. fsGroup makes the Longhorn volume
# writable by that group.
podSecurityContext:
  fsGroup: 1000

# The virtual printer binds 322 (RTSP) and 990 (FTPS), both privileged. Upstream compose
# uses `cap_add: NET_BIND_SERVICE` for exactly this.
#
# NET_BIND_SERVICE is on the Pod Security Admission *baseline* allowlist, so app-bambuddy
# stays a normal namespace with no privileged PSA labels. (It needed privileged during the
# brief hostNetwork experiment on 2026-08-01; host namespaces are not on the allowlist.)
securityContext:
  capabilities:
    add:
      - NET_BIND_SERVICE

service:
  main:
    enabled: true
    type: ClusterIP
    ports:
      http:
        enabled: true
        primary: true
        port: 8000

# Internal ingress on the homelab Traefik class. *.k8s.firekatt.ca resolves inside the
# LAN only (wildcard maps to 10.0.1.100 in blocky). TLS comes from Traefik's cluster-wide
# wildcard default cert, so no per-host tls block here.
#
# The root path redirects to the login page once authentication is switched on, so point
# the Uptime Kuma autodiscovery probe at the unauthenticated health endpoint instead.
ingress:
  main:
    enabled: true
    ingressClassName: internal
    annotations:
      uptime-kuma.autodiscovery.probe.path: /health
    hosts:
      - host: bambuddy.k8s.firekatt.ca
        paths:
          - path: /
            pathType: Prefix

# GET /health is the unauthenticated health check: returns {"status":"healthy"} as
# application/json. The wiki documents it as /api/v1/health, which 404s on 1.2.5.1; the
# real path per the app's own /openapi.json is /health with `security: null`.
# /api/v1/system/health exists too but sits behind HTTPBearer.
#
# Do not substitute /healthz or /metrics as a probe target. Both return HTTP 200, but
# they are the SPA catch-all serving index.html, so they stay green even when the
# backend is dead.
#
# Startup is slow on first boot because Bambuddy creates its whole schema, hence the
# generous liveness initialDelaySeconds.
probes:
  liveness:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 60
      periodSeconds: 30
  readiness:
    enabled: true
    custom: true
    spec:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 15
      periodSeconds: 10
  startup:
    enabled: false

# -----------------------------------------------------------------------------
# Storage
#   data   - archive/ (3MF + thumbnails), timelapses, library files, backups/.
#            Timelapses are the growth driver; upstream calls 10+ GB archives normal.
#   logs   - application logs, ephemeral, no reason to burn a Longhorn volume.
#   slicer - scratch for the sidecar only. mountPath "-" suppresses the mount in the
#            main container; the sidecar mounts it explicitly under additionalContainers.
# -----------------------------------------------------------------------------
persistence:
  data:
    enabled: true
    type: pvc
    mountPath: /app/data
    accessMode: ReadWriteOnce
    size: 100Gi
    storageClass: longhorn
  logs:
    enabled: true
    type: emptyDir
    mountPath: /app/logs
    sizeLimit: 1Gi
  slicer:
    enabled: true
    type: emptyDir
    mountPath: "-"
  vppatch:
    enabled: true
    type: configMap
    name: bambuddy-vp-advertise-patch
    mountPath: /opt/vp-patch
    sizeLimit: 20Gi

# Disable the common library's auto-generated Secret so it cannot collide with the
# sealed secrets in templates/.
secret: {}

env:
  TZ: America/Toronto
  PUID: "1000"
  PGID: "1000"
  PORT: "8000"

  # OrcaSlicer sidecar, same pod. Its default port is 3000, which the virtual printer
  # also binds - they share a network namespace - so the sidecar is moved to 3003.
  SLICER_API_URL: "http://127.0.0.1:3003"

  # FTPS passive mode has to advertise an address the slicer can reach, because that
  # address travels inside the protocol where NAT cannot rewrite it.
  VIRTUAL_PRINTER_PASV_ADDRESS: "10.0.1.102"

  # Read by the sitecustomize shim in templates/configmap-vp-advertise-patch.yaml. This is
  # the address handed to the slicer in net.info[].ip, so it must match the VIP.
  VP_ADVERTISE_IP: "10.0.1.102"

  # Puts the shim on the interpreter's path. Python imports `sitecustomize` at startup, so
  # the patch applies with no change to the image entrypoint.
  PYTHONPATH: /opt/vp-patch

  # Bambuddy needs the SQLAlchemy async driver prefix (postgresql+asyncpg://), which the
  # CNPG-generated `uri` key does not carry, and a URL cannot be assembled from secret
  # parts without risking percent-encoding bugs in the generated password. So the
  # credentials are supplied instead of generated - see templates/sealed-secret-*.yaml
  # and postgres.ownerSecret below.
  DATABASE_URL:
    valueFrom:
      secretKeyRef:
        name: bambuddy-database-url
        key: DATABASE_URL

# -----------------------------------------------------------------------------
# Server-side slicing sidecar. Versioned in lockstep with bambuddy upstream.
# amd64-only, which is what the nodeSelector above is for.
# -----------------------------------------------------------------------------
additionalContainers:
  slicer:
    image: ghcr.io/maziggy/orca-slicer-api:bambuddy-1.2.5.1
    imagePullPolicy: IfNotPresent
    env:
      - name: NODE_ENV
        value: production
      - name: PORT
        value: "3003"
    volumeMounts:
      - name: slicer
        mountPath: /app/data
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 4Gi

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 2Gi

# -----------------------------------------------------------------------------
# CloudNativePG-managed Postgres. The operator lives in app-cloudnative-pg.
#
# ownerSecret points bootstrap.initdb at a SealedSecret we control, so the password is a
# known alphanumeric string. With it set, CNPG does NOT generate a bambuddy-db-app
# secret. Bambuddy creates its own tables on first start; there is no migration job.
# -----------------------------------------------------------------------------
postgres:
  create: true
  clusterName: bambuddy-db
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5-3
  database: bambuddy
  owner: bambuddy
  ownerSecret: bambuddy-db-creds
  storage:
    size: 10Gi
    storageClass: longhorn
  # Enable CNPG Prometheus metrics so kube-prometheus-stack PodMonitor discovery picks
  # this cluster up, matching firebin-db / librarium-db / terminus-postgres.
  extraSpec:
    monitoring:
      enablePodMonitor: true

# -----------------------------------------------------------------------------
# Virtual printer: lets Bambu Studio / OrcaSlicer send jobs straight to Bambuddy.
# It wants its own IP and ~37 inbound ports, so it gets a dedicated MetalLB address out
# of service-pool (10.0.1.101-119). The VIP follows the pod between nodes, which is why
# this is preferred over hostNetwork.
#
# Tradeoff: SSDP announcements leave with the pod source address, not the VIP, so
# auto-discovery in the slicer will not find it. Add it manually at 10.0.1.102.
#
# passivePortCount 30 = three virtual printers, ten FTP passive ports each.
# -----------------------------------------------------------------------------
virtualPrinter:
  enabled: true
  loadBalancerIP: 10.0.1.102
  passivePortStart: 50000
  passivePortCount: 30

# -----------------------------------------------------------------------------
# Workaround for upstream deriving net.info[].ip from the bind address only. See the
# header comment in templates/configmap-vp-advertise-patch.yaml for the mechanism.
#
# Requires the VP's bind_ip to be 0.0.0.0 (set in the app, not here) so the patched
# fallback is the code path that runs. Drop all of this when upstream reads
# remote_interface_ip in mqtt_bridge.py.
# -----------------------------------------------------------------------------
vpAdvertisePatch:
  enabled: true

# ServiceMonitor only. The /api/v1/metrics endpoint itself is a UI toggle under
# Settings > Network > Prometheus Metrics, so the target stays down until that is on.
# While off it answers 404 with {"detail":"Prometheus metrics not enabled"}, which
# confirms the path is right and only the switch is missing.
metrics:
  enabled: true
  interval: 30s
