apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-lookout
  namespace: app-monitoring
  labels:
    grafana_dashboard: "1"
    app: kube-prometheus-stack-grafana
    release: kube-prometheus-stack
data:
  lookout-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Lookout: what needs attention across your GitHub projects, from its /metrics endpoint.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "type": "row",
          "title": "Needs attention",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "id": 2,
          "title": "Problems",
          "description": "Attention items of problem severity that aren't snoozed or dismissed, across every project.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(lookout_attention_items{severity=\"problem\"})",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "showPercentChange": false
          }
        },
        {
          "type": "stat",
          "id": 3,
          "title": "Warnings",
          "description": "Attention items of warning severity that aren't snoozed or dismissed, across every project.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(lookout_attention_items{severity=\"warning\"})",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "showPercentChange": false
          }
        },
        {
          "type": "stat",
          "id": 4,
          "title": "PRs waiting on you",
          "description": "Contributor pull requests waiting on your review, snoozed ones included.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(lookout_pull_requests_waiting_on_me{project=~\"$project\"})",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "#FF69B4",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "showPercentChange": false
          }
        },
        {
          "type": "stat",
          "id": 5,
          "title": "Issues waiting on you",
          "description": "Open issues where someone else had the last word.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(lookout_issues_their_turn{project=~\"$project\"})",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "showPercentChange": false
          }
        },
        {
          "type": "stat",
          "id": 6,
          "title": "Unreleased commits",
          "description": "Commits on the default branches since each repo's newest release.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(lookout_unreleased_commits{project=~\"$project\"})",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "blue",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "showPercentChange": false
          }
        },
        {
          "type": "stat",
          "id": 7,
          "title": "Failing CI",
          "description": "Repos whose default branch has failing checks on its head commit.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 15,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(lookout_ci_status{project=~\"$project\",run=\"default_branch\",state=\"failing\"}) or vector(0)",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "showPercentChange": false
          }
        },
        {
          "type": "stat",
          "id": 8,
          "title": "Releases not deployed",
          "description": "Repos whose deployed tag is behind the release it should run (phase 2).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 18,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(lookout_deploy_status{project=~\"$project\",status=\"behind\"}) or vector(0)",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "showPercentChange": false
          }
        },
        {
          "type": "stat",
          "id": 9,
          "title": "Last good poll",
          "description": "Time since the newest poll that read GitHub. Polls run every 10 minutes by default.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 21,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "time() - max(lookout_last_success_timestamp_seconds)",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "dtdurations",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1800
                  },
                  {
                    "color": "red",
                    "value": 3600
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "showPercentChange": false
          }
        },
        {
          "type": "timeseries",
          "id": 10,
          "title": "Attention items by kind",
          "description": "Items not snoozed or dismissed, across every project: these series carry no project label.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (kind) (lookout_attention_items)",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "{{`{{kind}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 15,
                "showPoints": "never",
                "spanNulls": false,
                "lineInterpolation": "stepAfter",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "state-timeline",
          "id": 11,
          "title": "Project health",
          "description": "Each project's health: problem beats attention beats ok, and notes change nothing.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (project) ((lookout_project_health{project=~\"$project\",health=\"ok\"} * 0) or (lookout_project_health{project=~\"$project\",health=\"attention\"} * 1) or (lookout_project_health{project=~\"$project\",health=\"problem\"} * 2))",
              "refId": "A",
              "range": true,
              "instant": false,
              "legendFormat": "{{`{{project}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "ok",
                      "color": "green",
                      "index": 0
                    },
                    "1": {
                      "text": "attention",
                      "color": "orange",
                      "index": 1
                    },
                    "2": {
                      "text": "problem",
                      "color": "red",
                      "index": 2
                    }
                  }
                }
              ],
              "custom": {
                "fillOpacity": 75,
                "lineWidth": 0
              }
            },
            "overrides": []
          },
          "options": {
            "mergeValues": true,
            "showValue": "auto",
            "alignValue": "left",
            "rowHeight": 0.9,
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": false
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          }
        },
        {
          "type": "table",
          "id": 12,
          "title": "By project",
          "description": "What each project has waiting, the counts behind its health.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 16,
            "x": 0,
            "y": 13
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (project) ((lookout_project_health{project=~\"$project\",health=\"ok\"} * 0) or (lookout_project_health{project=~\"$project\",health=\"attention\"} * 1) or (lookout_project_health{project=~\"$project\",health=\"problem\"} * 2))",
              "refId": "A",
              "range": false,
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (project) (lookout_pull_requests_waiting_on_me{project=~\"$project\"})",
              "refId": "B",
              "range": false,
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (project) (lookout_issues_their_turn{project=~\"$project\"})",
              "refId": "C",
              "range": false,
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (project) (lookout_unreleased_commits{project=~\"$project\"})",
              "refId": "D",
              "range": false,
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(count by (project) (lookout_ci_status{project=~\"$project\",run=\"default_branch\",state=\"failing\"})) or (sum by (project) (lookout_repos{project=~\"$project\"}) * 0)",
              "refId": "E",
              "range": false,
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(count by (project) (lookout_deploy_status{project=~\"$project\",status=\"behind\"})) or (sum by (project) (lookout_repos{project=~\"$project\"}) * 0)",
              "refId": "F",
              "range": false,
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (project) (lookout_repos{project=~\"$project\"})",
              "refId": "G",
              "range": false,
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "namespace": true,
                  "pod": true,
                  "service": true,
                  "container": true,
                  "endpoint": true
                },
                "renameByName": {
                  "project": "Project",
                  "Value #A": "Health",
                  "Value #B": "PRs waiting on you",
                  "Value #C": "Issues waiting on you",
                  "Value #D": "Unreleased commits",
                  "Value #E": "Failing CI",
                  "Value #F": "Not deployed",
                  "Value #G": "Repos"
                },
                "indexByName": {
                  "project": 0,
                  "Value #A": 1,
                  "Value #G": 2,
                  "Value #B": 3,
                  "Value #C": 4,
                  "Value #D": 5,
                  "Value #E": 6,
                  "Value #F": 7
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Health"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "ok",
                            "color": "green",
                            "index": 0
                          },
                          "1": {
                            "text": "attention",
                            "color": "orange",
                            "index": 1
                          },
                          "2": {
                            "text": "problem",
                            "color": "red",
                            "index": 2
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "sortBy": [
              {
                "displayName": "Health",
                "desc": true
              }
            ],
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "countRows": false,
              "fields": ""
            }
          }
        },
        {
          "type": "bargauge",
          "id": 13,
          "title": "Snoozed and dismissed",
          "description": "Attention items hidden by a snooze or a dismissal, by kind.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 13
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (kind) (lookout_attention_hidden_items)",
              "refId": "A",
              "range": false,
              "instant": true,
              "legendFormat": "{{`{{kind}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "displayMode": "gradient",
            "orientation": "horizontal",
            "showUnfilled": true,
            "valueMode": "color",
            "namePlacement": "auto",
