# Runs every 15s over all debug-* namespaces:
#   1. Deletes any past creationTimestamp + ttl. No ttl annotation counts as 1h.
#      The ttl is clamped to 720h whatever the annotation says.
#   2. Applies the quota, limits and agent RoleBinding the agent cannot edit.
#
# A new namespace is usable by the agent about 15s after it is created.
apiVersion: v1
kind: ConfigMap
metadata:
  name: debug-controller
  namespace: app-debug
data:
  loop.sh: |
    #!/usr/bin/env bash
    set -u
    PREFIX="debug-"
    MAX_HOURS=720
    NO_TTL_HOURS=1

    bootstrap() {
      kubectl apply -f - <<YAML
    apiVersion: v1
    kind: ResourceQuota
    metadata:
      name: debug-quota
      namespace: $1
    spec:
      hard:
        requests.cpu: "4"
        requests.memory: 8Gi
        limits.cpu: "8"
        limits.memory: 16Gi
        pods: "30"
        services: "20"
        services.loadbalancers: "0"
        services.nodeports: "0"
        count/ingresses.networking.k8s.io: "5"
        persistentvolumeclaims: "2"
        requests.storage: 10Gi
        longhorn.storageclass.storage.k8s.io/persistentvolumeclaims: "0"
    ---
    apiVersion: v1
    kind: LimitRange
    metadata:
      name: debug-limits
      namespace: $1
    spec:
      limits:
      - type: Container
        defaultRequest:
          cpu: 50m
          memory: 128Mi
        default:
          cpu: "1"
          memory: 1Gi
        max:
          cpu: "4"
          memory: 4Gi
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: debug-agent
      namespace: $1
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: debug-ns-admin
    subjects:
    - kind: ServiceAccount
      name: debug-agent
      namespace: app-debug
    YAML
    }

    while true; do
      now=$(date +%s)
      kubectl get ns -o json | jq -r --arg p "$PREFIX" '
        .items[]
        | select(.metadata.name | startswith($p))
        | select(.metadata.deletionTimestamp | not)
        | [.metadata.name,
           (.metadata.creationTimestamp | fromdateiso8601),
           (.metadata.annotations["debug.firekatt.ca/ttl"] // "")]
        | @tsv' | while IFS=$'\t' read -r name created ttl; do
          if [[ "$ttl" =~ ^[0-9]+h$ ]]; then hours=${ttl%h}; else hours=$NO_TTL_HOURS; fi
          (( hours > MAX_HOURS )) && hours=$MAX_HOURS
          if (( now > created + hours * 3600 )); then
            echo "reaping $name (ttl ${ttl:-none}, effective ${hours}h)"
            kubectl delete ns "$name" --wait=false
          else
            bootstrap "$name" >/dev/null || echo "bootstrap failed for $name"
          fi
        done
      touch /tmp/alive
      sleep 15
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debug-controller
  namespace: app-debug
  labels:
    app.kubernetes.io/name: debug-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: debug-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: debug-controller
    spec:
      serviceAccountName: debug-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: controller
        image: alpine/k8s:1.36.5
        command: ["bash", "/scripts/loop.sh"]
        env:
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 128Mi
        livenessProbe:
          exec:
            command: ["sh", "-c", "find /tmp/alive -mmin -2 | grep -q ."]
          initialDelaySeconds: 60
          periodSeconds: 60
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: scripts
        configMap:
          name: debug-controller
      - name: tmp
        emptyDir: {}
