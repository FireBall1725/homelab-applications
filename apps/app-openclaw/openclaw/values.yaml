openclaw:
  app-template:
    openclawVersion: "2026.9.5"
    # Git is the source of truth; runtime edits to openclaw.json are replaced on restart.
    configMode: overwrite

    controllers:
      main:
        initContainers:
          # The volume root is owned by root, and 2.0 chmods the state dir to 700, which only its owner may do.
          init-perms:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: "{{ .Values.openclawVersion }}"
            command:
              - sh
              - -c
              - >-
                chown 1000:1000 /home/node /home/node/.openclaw &&
                find /home/node/.openclaw -xdev ! -user 1000
                ! -path /home/node/.openclaw/lost+found ! -path '/home/node/.openclaw/lost+found/*'
                -print -exec chown 1000:1000 {} +
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - DAC_OVERRIDE
          init-config:
            dependsOn: init-perms
          # 2.0 refuses to start on a pre-2.0 session store and installs the Discord plugin from npm.
          init-doctor:
            dependsOn: init-config
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: "{{ .Values.openclawVersion }}"
            command:
              - node
              - /app/dist/index.js
              - doctor
              - --fix
              - --non-interactive
            envFrom:
              - secretRef:
                  name: openclaw-secrets
            env:
              NPM_CONFIG_CACHE: /tmp/.npm
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
        containers:
          main:
            envFrom:
              - secretRef:
                  name: openclaw-secrets
            env:
              NPM_CONFIG_CACHE: /tmp/.npm

    ingress:
      main:
        enabled: true
        className: internal
        hosts:
          - host: openclaw.k8s.firekatt.ca
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http

    persistence:
      data:
        storageClass: longhorn
        advancedMounts:
          main:
            init-perms:
              - path: /home/node/.openclaw
            init-doctor:
              - path: /home/node/.openclaw
      tmp:
        advancedMounts:
          main:
            init-doctor:
              - path: /tmp
      # Plugin installs write to $HOME, which is otherwise on the read-only root.
      home:
        enabled: true
        type: emptyDir
        advancedMounts:
          main:
            init-perms:
              - path: /home/node
            init-doctor:
              - path: /home/node
            main:
              - path: /home/node

    configMaps:
      config:
        enabled: true
        data:
          openclaw.json: |
            {
              "gateway": {
                "port": 18789,
                "mode": "local",
                "trustedProxies": ["10.244.0.0/16"],
                "controlUi": {
                  "allowedOrigins": ["https://openclaw.k8s.firekatt.ca"]
                },
                "terminal": {
                  "enabled": false
                }
              },
              "browser": {
                "enabled": true,
                "defaultProfile": "default",
                "profiles": {
                  "default": {
                    "cdpUrl": "http://localhost:9222",
                    "attachOnly": true
                  }
                }
              },
              "models": {
                "providers": {
                  "ollama": {
                    "apiKey": "ollama-local",
                    "baseUrl": "http://ollama.app-ai.svc.cluster.local:11434",
                    "api": "ollama",
                    "timeoutSeconds": 300,
                    "models": [
                      {
                        "id": "qwen3.6:latest",
                        "name": "Qwen 3.6",
                        "contextWindow": 65536,
                        "contextTokens": 65536,
                        "params": {
                          "num_ctx": 65536,
                          "thinking": false,
                          "keep_alive": -1
                        }
                      }
                    ]
                  }
                }
              },
              "agents": {
                "defaults": {
                  "workspace": "/home/node/.openclaw/workspace",
                  "model": {
                    "primary": "ollama/qwen3.6:latest"
                  },
                  "userTimezone": "America/Toronto",
                  "timeoutSeconds": 600,
                  "maxConcurrent": 1
                },
                "entries": {
                  "main": {
                    "identity": {
                      "name": "OpenClaw",
                      "emoji": "🦞"
                    }
                  }
                }
              },
              "session": {
                "scope": "per-sender",
                "reset": {
                  "mode": "idle",
                  "idleMinutes": 60
                }
              },
              "logging": {
                "level": "info",
                "consoleLevel": "info"
              },
              "tools": {
                "profile": "full",
                "web": {
                  "search": {
                    "enabled": false
                  },
                  "fetch": {
                    "enabled": true
                  }
                }
              },
              "commands": {
                "native": "auto",
                "nativeSkills": "auto",
                "restart": true
              },
              "plugins": {
                "entries": {
                  "discord": {
                    "enabled": true
                  }
                }
              },
              "channels": {
                "discord": {
                  "enabled": true,
                  "token": "${DISCORD_BOT_TOKEN}",
                  "dmPolicy": "allowlist",
                  "allowFrom": ["93194491795607552"],
                  "groupPolicy": "disabled"
                }
              }
            }
