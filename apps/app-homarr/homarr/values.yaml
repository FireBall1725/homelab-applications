homarr:
  image:
    tag: "v1.77.2"

  # The database is a ReadWriteOnce Longhorn volume. A rolling update starts the new
  # pod first, and when it lands on another node it can't attach the volume the old
  # pod still holds, so both wait forever (hit on the 5.3.0 -> 8.29.2 bump, #217).
  strategyType: Recreate

  # Chart 8.x reads SECRET_ENCRYPTION_KEY from a secret named db-encryption; ours has
  # been db-secret since the install (created by hand, not in git). Point at it, because
  # a new key would leave every stored integration credential unreadable.
  envSecrets:
    dbEncryption:
      existingSecret: "db-secret"

  env:
    TZ: "America/Toronto"

  persistence:
    homarrDatabase:
      enabled: true
      storageClassName: "longhorn"

  ingress:
    enabled: true
    hosts:
      - host: home.k8s.firekatt.ca
        paths:
          - path: /
            pathType: Prefix
