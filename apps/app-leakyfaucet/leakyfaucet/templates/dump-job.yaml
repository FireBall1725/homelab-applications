apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.postgres.clusterName }}-dump
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.dump.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.dump.size | quote }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.postgres.clusterName }}-dump
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.dump.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: {{ .Values.postgres.imageName | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.postgres.clusterName }}-app
                      key: uri
                - name: KEEP_DAYS
                  value: {{ .Values.dump.keepDays | quote }}
              command:
                - /bin/sh
                - -ec
                - |
                  f=/dump/db-$(date +%Y-%m-%d).sql.gz
                  pg_dump --no-owner --no-privileges "$DATABASE_URL" | gzip > "$f.tmp"
                  test -s "$f.tmp"
                  mv "$f.tmp" "$f"
                  find /dump -name 'db-*.sql.gz' -mtime +"$KEEP_DAYS" -delete
                  ls -l /dump
              volumeMounts:
                - name: dump
                  mountPath: /dump
          volumes:
            - name: dump
              persistentVolumeClaim:
                claimName: {{ .Values.postgres.clusterName }}-dump
