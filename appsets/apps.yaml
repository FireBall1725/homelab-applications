# https://argo-cd.readthedocs.io/en/stable/user-guide/application-set/
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab-apps
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  # Create and update, never delete. Every generated Application carries
  # resources-finalizer.argocd.argoproj.io and no PVC in homelab-applications
  # sets helm.sh/resource-policy: keep, so deleting an Application takes its
  # volumes with it. Removing an app is deliberate: delete its directory, then
  # kubectl delete application <name> -n core-argocd.
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true

  generators:
  - git:
      repoURL: https://github.com/FireBall1725/homelab-config.git
      revision: HEAD
      files:
      - path: "apps/*/app-config.json"
  template:
    metadata:
      name: '{{ index .path.segments 1 }}'
    spec:
      project: homelab-gitops
      source:
        repoURL: https://github.com/FireBall1725/homelab-applications.git
        targetRevision: '{{ .targetRevision }}'
        path: '{{ index .path.segments 1 }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace={{ or .createNamespace true }}
          - Replace={{ or .replace false }}
          - 'ServerSideApply={{ index . "serverSideApply" | default false }}'
