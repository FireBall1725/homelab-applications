apiVersion: v2
name: firebin-web
description: FireBin Web - React frontend (nginx) for the self-hosted FireBin parts inventory.
type: application

# Chart version. Bump on template/values changes; does not need to match appVersion.
version: 0.1.1

# Tracks the firebin-web release. Keep in sync with the pinned image tag in values.yaml.
appVersion: "26.7.1"

kubeVersion: ">=1.25.0-0"

home: https://github.com/fireball1725/firebin
sources:
  - https://github.com/fireball1725/firebin-web
maintainers:
  - name: fireball1725
    url: https://github.com/fireball1725

keywords:
  - firebin
  - inventory
  - electronics
  - parts
  - self-hosted

dependencies:
  - name: common
    version: 5.0.3
    repository: https://fireball1725.github.io/firelabs-helm-common/
