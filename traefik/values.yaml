# Traefik ingress controller configuration
# https://github.com/traefik/traefik-helm-chart

traefik:
  # Deployment configuration
  deployment:
    replicas: 2

  # Image configuration
  image:
    tag: v3.4.0

  # IngressClass configuration
  ingressClass:
    enabled: true
    isDefaultClass: true
    name: internal

  # Logging configuration
  logs:
    general:
      level: INFO
    access:
      enabled: true

  # Metrics configuration
  metrics:
    prometheus:
      enabled: true

  # Service configuration
  service:
    annotations: {}
    spec:
      externalTrafficPolicy: Local
      loadBalancerIP: 10.0.1.100

  # Additional CLI arguments for Traefik
  # Apply error-pages middleware globally to all entrypoints
  # This ensures custom error pages are shown for all HTTP errors (400-599)
  # Reference format: namespace-middlewarename@kubernetescrd
  additionalArguments:
    - "--entryPoints.web.http.middlewares=core-traefik-ingress-error-pages@kubernetescrd"
    - "--entryPoints.websecure.http.middlewares=core-traefik-ingress-error-pages@kubernetescrd"
    # Responding-timeout hardening for long-lived MCP-over-SSE streams on
    # websecure (basic-memory MCP, ha-mcp, node-red-mcp). The default idleTimeout
    # is 180s; a keepalive that stalls past it during a heavy sync/index cycle
    # would let Traefik reap the stream, and the SSE client does not reconnect.
    # A large finite idleTimeout avoids that without disabling idle reaping
    # entirely (0s would let idle keep-alive connections accumulate unbounded).
    - "--entryPoints.websecure.transport.respondingTimeouts.idleTimeout=3600s"
    - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=0s"
